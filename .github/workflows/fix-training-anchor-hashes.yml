name: Fix Training anchor hashes

on:
  push:
    paths:
      - '.github/workflows/fix-training-anchor-hashes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escape Training URL fragment hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('routes/TrainingRoutes.cfm')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/training-tracker/admin#content', '/training-tracker/admin##content')
          s = s.replace('/training-tracker/admin#appearance', '/training-tracker/admin##appearance')
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-training-anchor-hashes.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Escape Training URL fragment hashes"
          git push
