name: Fix SES route path handling

on:
  push:
    paths:
      - '.github/workflows/fix-ses-route-path.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prefer CGI path_info for rewritten SES URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.cfm')
          s = p.read_text(encoding='utf-8')
          old = 'function routePath(){var p=listFirst(cgi.request_uri?:"/","?");p=reReplace(p,"^/index\\.cfm","");if(!len(p))p="/";return p;}'
          new = 'function routePath(){var p=trim(cgi.path_info?:"");if(!len(p)||p=="/index.cfm")p=listFirst(cgi.request_uri?:"/","?");p=reReplace(p,"^/index\\.cfm","");if(!len(p))p="/";if(left(p,1)!="/")p="/"&p;return p;}'
          if old not in s:
              raise SystemExit('routePath marker not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          Path('.github/workflows/fix-ses-route-path.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use CGI path_info for CommandBox SES routes"
          git push
