name: Fix CFML color literals

on:
  push:
    paths:
      - '.github/workflows/fix-cfml-color-literals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escape literal CSS hashes in CFML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for p in list(Path('.').rglob('*.cfm')) + list(Path('.').rglob('*.cfc')):
              s = p.read_text(encoding='utf-8')
              ns = re.sub(r'(?<!#)#([0-9A-Fa-f]{6})(?![0-9A-Fa-f])', r'##\1', s)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(str(p))
          print('Patched:', ', '.join(changed) if changed else 'none')

          # One-time migration workflows are no longer needed after their
          # corresponding patches have landed.
          for name in [
              '.github/workflows/normalize-cfml-and-training-parity.yml',
              '.github/workflows/fix-inventory-max.yml',
              '.github/workflows/fix-cfml-color-literals.yml',
          ]:
              p = Path(name)
              if p.exists():
                  p.unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize CFML CSS color literals"
          git push
