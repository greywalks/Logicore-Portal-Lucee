name: Fix Inventory Lucee max compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Lucee max arity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/InventoryService.cfc')
          s = p.read_text()
          old = 'max(yi,vi,mi)'
          new = 'max(yi,max(vi,mi))'
          if old not in s:
              print('Inventory max arity already fixed')
          else:
              p.write_text(s.replace(old, new))
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/InventoryService.cfc
          git commit -m "Fix Inventory max arity for Lucee"
          git push
