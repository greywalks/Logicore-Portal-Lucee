name: Apply Training router parity

on:
  push:
    paths:
      - '.github/workflows/apply-training-router-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Training dispatch and labels
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.cfm')
          s=p.read_text(encoding='utf-8')
          inventory='if(left(path,len("/inventory-management"))=="/inventory-management"){include "routes/InventoryRoutes.cfm";abort;}\n'
          addition=inventory+'if(left(path,len("/training-tracker"))=="/training-tracker"){include "routes/TrainingRoutes.cfm";abort;}\n'
          if 'include "routes/TrainingRoutes.cfm"' not in s:
              if inventory not in s:
                  raise SystemExit('Inventory dispatch anchor not found')
              s=s.replace(inventory,addition,1)
          s=s.replace('> TBD2</label>', '> Inventory Management</label>')
          s=s.replace('>TBD2</label>', '>Inventory Management</label>')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/apply-training-router-parity.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire parity Training Tracker routes"
          git push
