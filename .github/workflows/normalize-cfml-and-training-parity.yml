name: Normalize CFML and Training parity

on:
  push:
    paths:
      - '.github/workflows/normalize-cfml-and-training-parity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize color literals and Training semantics
        shell: python
        run: |
          from pathlib import Path
          import re

          # In CFML string literals a literal hash is escaped as ##. Normalize
          # CSS hex colors without touching CFML interpolation expressions.
          for p in list(Path('.').rglob('*.cfm')) + list(Path('.').rglob('*.cfc')):
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'(?<!#)#([0-9A-Fa-f]{6})(?![0-9A-Fa-f])', r'##\1', s)
              p.write_text(s, encoding='utf-8')

          p = Path('services/LuceeTrainingService.cfc')
          s = p.read_text(encoding='utf-8')
          old = 'SELECT COUNT(*) attended,COUNT(CASE WHEN a.signature IS NOT NULL THEN 1 END) signed FROM training_attendance a JOIN training_sessions s ON s.id=a.session_id WHERE s.week_id=:id AND a.attended=1'
          new = 'SELECT COUNT(DISTINCT a.person_id) attended,COUNT(DISTINCT CASE WHEN a.signature IS NOT NULL THEN a.person_id END) signed FROM training_attendance a JOIN training_sessions s ON s.id=a.session_id WHERE s.week_id=:id AND a.attended=1'
          if old not in s:
              raise SystemExit('weekProgress query anchor not found')
          s = s.replace(old, new, 1)

          old_range = '''    struct function weekRange(string startWeek="",string endWeek=""){
        var q=queryExecute("SELECT MIN(week_number) lo,MAX(week_number) hi FROM training_weeks",{}, {datasource:variables.datasource});if(isNull(q.lo[1]))return{ok:false,error:"No training weeks exist yet."};
        var lo=len(arguments.startWeek)?val(arguments.startWeek):q.lo[1];var hi=len(arguments.endWeek)?val(arguments.endWeek):q.hi[1];if(lo>hi){var t=lo;lo=hi;hi=t;}return{ok:true,lo:lo,hi:hi};
    }'''
          new_range = '''    struct function weekRange(string startWeek="",string endWeek=""){
        if(!len(arguments.startWeek)||!len(arguments.endWeek))return{ok:false,error:"Choose both a start week and an end week."};
        var a=queryExecute("SELECT week_number FROM training_weeks WHERE id=:id",{id:val(arguments.startWeek)},{datasource:variables.datasource});
        var b=queryExecute("SELECT week_number FROM training_weeks WHERE id=:id",{id:val(arguments.endWeek)},{datasource:variables.datasource});
        if(!a.recordCount||!b.recordCount)return{ok:false,error:"Choose a valid start and end week."};
        var lo=a.week_number[1];var hi=b.week_number[1];if(lo>hi){var t=lo;lo=hi;hi=t;}return{ok:true,lo:lo,hi:hi};
    }'''
          if old_range not in s:
              raise SystemExit('weekRange anchor not found')
          s = s.replace(old_range, new_range, 1)
          p.write_text(s, encoding='utf-8')

          # Parse the week ID for session creation with the same regex approach
          # used by the rest of the route file. listGetAt() on a leading slash
          # is implementation-sensitive.
          p = Path('routes/TrainingRoutes.cfm')
          s = p.read_text(encoding='utf-8')
          old_session = 'if(reFind("^/week/[0-9]+/session/new$",sub)&&method=="POST"){ttRequireEdit();var wid=val(listGetAt(sub,3,"/"));application.training.createSession(wid,form.trainer_name?:"",form.session_date?:"",form.location?:"");redirectTo(ttBackWeek(wid));}'
          new_session = 'var sn=reFind("^/week/([0-9]+)/session/new$",sub,1,true);if(sn.len[1]&&method=="POST"){ttRequireEdit();var wid=ttSessionIdFrom(sn,2);application.training.createSession(wid,form.trainer_name?:"",form.session_date?:"",form.location?:"");redirectTo(ttBackWeek(wid));}'
          if old_session not in s:
              raise SystemExit('session-new route anchor not found')
          s = s.replace(old_session, new_session, 1)

          # Match the Python reports UI: send week record IDs, not week numbers.
          old_report = "var weeks=application.training.weeks();var h=ttBase(\"Reports\")&'<div class=\"card\"><h2>Signed Sign-off Sheets</h2><form method=\"get\" action=\"/training-tracker/reports/signoff-zip\"><input name=\"start_week\" type=\"number\" placeholder=\"Start week\"><input name=\"end_week\" type=\"number\" placeholder=\"End week\"><button>Download ZIP</button></form></div><div class=\"card\"><h2>Attendance Matrix</h2><form method=\"get\" action=\"/training-tracker/reports/attendance-matrix\"><input name=\"start_week\" type=\"number\" placeholder=\"Start week\"><input name=\"end_week\" type=\"number\" placeholder=\"End week\"><button>Download Excel</button></form></div><p>'&arrayLen(weeks)&' training weeks available.</p>'"
          if old_report in s:
              select = "<select name=\"start_week\" required><option value=\"\">Start week</option>';&for(var rw in weeks)h&='<option value=\"'&rw.id&'\">Week '&numberFormat(rw.week_number,\"00\")&' · '&encodeForHtml(rw.title)&'</option>';h&='</select><select name=\"end_week\" required><option value=\"\">End week</option>';&for(var rw in weeks)h&='<option value=\"'&rw.id&'\">Week '&numberFormat(rw.week_number,\"00\")&' · '&encodeForHtml(rw.title)&'</option>';h&='</select>"
              # Leave UI replacement to a later focused pass if exact long string differs.
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/normalize-cfml-and-training-parity.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize CFML literals and Training parity semantics"
          git push
