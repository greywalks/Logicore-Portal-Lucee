name: Lucee smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1
        with:
          installSystemModules: true

      - name: Start Lucee
        run: |
          box server start --noOpenBrowser
          sleep 15

      - name: Verify health endpoint
        run: curl --fail-with-body --show-error --retry 3 --retry-delay 2 http://127.0.0.1:5000/healthz

      - name: Verify login page
        run: |
          curl -sS -D login.headers -o login.body http://127.0.0.1:5000/login
          grep -q "HTTP/1.1 200" login.headers
          grep -q "Sign in" login.body

      - name: Authenticate default administrator
        run: |
          curl -sS -D auth.headers -o auth.body -c cookies.txt -b cookies.txt \
            -X POST -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'username=admin&password=admin&next=/' \
            http://127.0.0.1:5000/login
          grep -Eq "HTTP/1.1 30[12378]" auth.headers

      - name: Verify portal shell
        run: |
          curl --fail-with-body -sS -b cookies.txt http://127.0.0.1:5000/ -o portal.body
          grep -q "Logicore" portal.body

      - name: Verify permissions admin
        run: |
          curl --fail-with-body -sS -b cookies.txt http://127.0.0.1:5000/admin/permissions -o admin.body
          grep -q "Users & Permissions" admin.body

      - name: Verify Training Tracker
        run: |
          code=$(curl -sS -b cookies.txt -D training.headers -o training.body -w '%{http_code}' http://127.0.0.1:5000/training-tracker/)
          echo "Training HTTP: $code"
          cat training.headers
          head -c 4000 training.body || true
          echo
          test "$code" = "200"
          grep -q "Training" training.body

      - name: Verify Inventory Management
        run: |
          curl --fail-with-body -sS -b cookies.txt http://127.0.0.1:5000/inventory-management/ -o inventory.body
          grep -q "Inventory Management" inventory.body

      - name: Verify NonConforming API
        run: |
          curl --fail-with-body -sS -b cookies.txt http://127.0.0.1:5000/nonconforming/api/items -o nonconforming.json
          grep -qi '"ok"' nonconforming.json

      - name: Verify config API
        run: |
          curl --fail-with-body -sS -b cookies.txt http://127.0.0.1:5000/get_storage_prices -o storage-prices.json
          grep -qi '"ok"' storage-prices.json

      - name: Show Lucee logs on failure
        if: failure()
        run: |
          echo "--- captured responses ---"
          for f in training.headers training.body inventory.body nonconforming.json storage-prices.json; do if [ -f "$f" ]; then echo "--- $f ---"; head -c 8000 "$f"; echo; fi; done
          echo "--- Logicore application errors ---"
          find "$HOME/.CommandBox/server" -type f -name 'logicore.log' -print -exec tail -n 80 {} \; || true
          echo "--- application log tail ---"
          find "$HOME/.CommandBox/server" -type f -name 'application.log' -print -exec tail -n 80 {} \; || true

      - name: Stop Lucee
        if: always()
        run: box server stop || true
