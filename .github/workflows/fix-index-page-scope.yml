name: Fix remaining index page scope

on:
  push:
    paths:
      - '.github/workflows/fix-index-page-scope.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final page-scope var
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.cfm')
          s = p.read_text(encoding='utf-8')
          old = 'var path=routePath();method='
          new = 'path=routePath();method='
          if old not in s:
              raise SystemExit('Expected page-scope declaration was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-index-page-scope.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining index page-scope declaration"
          git push
