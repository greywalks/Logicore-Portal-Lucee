name: Normalize Training CFML hash escapes

on:
  push:
    paths:
      - '.github/workflows/normalize-training-hash-escapes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize triple hashes to valid escaped literals
        shell: python
        run: |
          from pathlib import Path
          for name in ['services/LuceeTrainingService.cfc','routes/TrainingRoutes.cfm']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              while '###' in s:
                  s=s.replace('###','##')
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/normalize-training-hash-escapes.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Training CFML hash escapes"
          git push
